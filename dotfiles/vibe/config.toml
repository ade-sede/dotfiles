# Mistral Vibe Configuration
# https://github.com/mistralai/mistral-vibe

# Active model - using Scaleway provider
active_model = "scaleway-mistral-large"

# Providers configuration
[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
backend = "MISTRAL"

[[providers]]
name = "scaleway"
api_base = "https://api.scaleway.ai/v1"
api_key_env_var = "SCALEWAY_API_KEY"
backend = "GENERIC"
api_style = "openai"

[[providers]]
name = "anthropic"
api_base = "https://api.anthropic.com/v1"
api_key_env_var = "ANTHROPIC_API_KEY"
backend = "GENERIC"
api_style = "openai"

[[providers]]
name = "openai"
api_base = "https://api.openai.com/v1"
api_key_env_var = "OPENAI_API_KEY"
backend = "GENERIC"
api_style = "openai"

[[providers]]
name = "gemini"
api_base = "https://generativelanguage.googleapis.com/v1beta"
api_key_env_var = "GEMINI_API_KEY"
backend = "GENERIC"
api_style = "google"

# Models configuration
[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-cli"
input_price = 0.4
output_price = 2.0

[[models]]
name = "scaleway-mistral-large"
provider = "scaleway"
alias = "scaleway-mistral-large"
temperature = 0.2
input_price = 0.0
output_price = 0.0

[[models]]
name = "glm-5.2"
provider = "scaleway"
alias = "glm-5.2"
temperature = 0.2
input_price = 0.0
output_price = 0.0

[[models]]
name = "deepseek-v4-flash-0731"
provider = "scaleway"
alias = "deepseek-v4-flash-0731"
temperature = 0.2
input_price = 0.0
output_price = 0.0

[[models]]
name = "claude-3-5-sonnet-20241022"
provider = "anthropic"
alias = "claude-sonnet"
input_price = 3.0
output_price = 15.0

[[models]]
name = "gpt-4o"
provider = "openai"
alias = "gpt-4o"
input_price = 5.0
output_price = 15.0

[[models]]
name = "gemini-1.5-flash"
provider = "gemini"
alias = "gemini-flash"
input_price = 0.35
output_price = 1.05
